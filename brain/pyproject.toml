[project]
name = "brain"
version = "0.1.0"
description = "Spec + exploded view -> UN Regulation requirements for the Certivity challenge"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.15.0",
    "jsonschema",
    "numpy",
    "pydantic>=2",
    "pymupdf",
    "scikit-learn",
    "scipy",
]

[project.optional-dependencies]
llm = ["anthropic", "openai"]
tabpfn = ["tabpfn"]

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["brain", "eval"]
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]
